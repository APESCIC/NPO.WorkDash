# Apache site for NPO.WorkDash on the Cloudron LAMP app.
# Copy to /app/data/apache/app.conf and restart the app.
# /app/data/workdash is a symlink to the current release (see deploy.sh).

ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    UseCanonicalName Off
    DocumentRoot /app/data/workdash/public

    LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" proxy
    CustomLog "|/bin/cat" proxy
    ErrorLog "|/bin/cat"

    <Directory /app/data/workdash/public>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Required by Cloudron so the app sees the real client IP.
    Include "/app/code/apache/rpaf.conf"

    # phpMyAdmin is deliberately not included. To use it temporarily, add:
    # Include "/app/code/apache/phpmyadmin.conf"
</VirtualHost>

# NPO WorkDash's own Laragon virtual host: PHP 8.3 (as on its Cloudron app) through
# FastCGI, while Laragon's other sites keep its global PHP. Copy it to
# C:\laragon\etc\apache2\sites-enabled\npo-workdash.test.conf (no "auto." prefix, so
# Laragon keeps it) and delete auto.npo-workdash.test.conf, then Reload Apache.
# scripts\laragon-setup.ps1 -InstallVhost does exactly that.
define ROOT "C:/laragon/www/npo-workdash/public"
define SITE "npo-workdash.test"
define WORKDASH_PHP "C:/laragon/bin/php/php-8.3.33-Win32-vs16-x64"

<VirtualHost *:80>
    DocumentRoot "${ROOT}"
    ServerName ${SITE}
    ServerAlias *.${SITE}
    FcgidCmdOptions "${WORKDASH_PHP}/php-cgi.exe" \
        InitialEnv PHPRC="${WORKDASH_PHP}" \
        InitialEnv PATH="${WORKDASH_PHP};C:/Windows/system32;C:/Windows;C:/Windows/System32/Wbem;" \
        InitialEnv PHP_FCGI_MAX_REQUESTS=0
    <Directory "${ROOT}">
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "\.php$">
        AddHandler fcgid-script .php
        Options +ExecCGI
        FcgidWrapper "${WORKDASH_PHP}/php-cgi.exe" .php
    </FilesMatch>
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot "${ROOT}"
    ServerName ${SITE}
    ServerAlias *.${SITE}
    FcgidCmdOptions "${WORKDASH_PHP}/php-cgi.exe" \
        InitialEnv PHPRC="${WORKDASH_PHP}" \
        InitialEnv PATH="${WORKDASH_PHP};C:/Windows/system32;C:/Windows;C:/Windows/System32/Wbem;" \
        InitialEnv PHP_FCGI_MAX_REQUESTS=0
    <Directory "${ROOT}">
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "\.php$">
        AddHandler fcgid-script .php
        Options +ExecCGI
        FcgidWrapper "${WORKDASH_PHP}/php-cgi.exe" .php
    </FilesMatch>

    SSLEngine on
    SSLCertificateFile      C:/laragon/etc/ssl/laragon.crt
    SSLCertificateKeyFile   C:/laragon/etc/ssl/laragon.key
</VirtualHost>